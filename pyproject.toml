[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonstg"
version = "0.1.0"
description = "Python and ModernGL shooting game runtime and authoring tools"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "glfw==2.10.0",
    "imgui[glfw]==2.0.0",
    "Pillow==12.1.0",
    "miniaudio==1.61",
    "freetype-py==2.5.1",
    "moderngl==5.12.0",
    "numpy==1.26.4",
    "numba==0.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "PySide6==6.8.1.1",
    "websockets==15.0.1",
    "pygame==2.6.1",
    "watchdog==4.0.1",
]

[project.scripts]
pystg = "main:main"
pystg-editor = "src.editor.app:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "game_content*", "tools*"]
namespaces = true
